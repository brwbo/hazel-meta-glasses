<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060b">
<title>Face scan test</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
:root {
  --bg: #04060b;
  --bg-2: #070b13;
  --line: #3b82f6;
  --line-2: rgba(59, 130, 246, 0.55);
  --line-3: rgba(59, 130, 246, 0.24);
  --name: #8dbdff;
  --text: #d6dde8;
  --muted: #8e9bb0;
  --danger: #ff7b8a;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
::selection { background: var(--line); color: #fff; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 1px solid var(--name); outline-offset: 2px; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--name); }
h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.stage { position: relative; border: 1px solid var(--line-3); background: var(--bg-2); min-height: 200px; line-height: 0; }
.stage img { display: block; width: 100%; max-height: 64vh; object-fit: contain; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stage-note { position: absolute; left: 12px; bottom: 10px; line-height: 1.5; color: var(--muted); background: rgba(4, 6, 11, 0.8); padding: 2px 8px; }
.panels { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { border: 1px solid var(--line-3); padding: 16px; background: var(--bg-2); }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; }
button, .link { min-height: 44px; padding: 8px 16px; border: 1px solid var(--line-2); background: transparent; color: var(--text); font: inherit; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
button:hover:not(:disabled) { background: rgba(59, 130, 246, 0.16); border-color: var(--line); }
button.primary { background: var(--line); border-color: var(--line); color: #04060b; font-weight: 600; }
button.primary:hover:not(:disabled) { background: #5a97f8; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.status { margin-top: 12px; min-height: 3em; color: var(--text); max-width: 60ch; }
.status[data-tone="error"] { color: var(--danger); }
.status[data-tone="wait"] { color: var(--name); }
.readout { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; margin-top: 16px; }
.guide { width: 150px; height: 150px; }
.hint { font-size: 20px; line-height: 1.2; color: var(--name); text-transform: uppercase; letter-spacing: 0.04em; min-height: 1.2em; }
.coverage { margin-top: 8px; color: var(--muted); }
.coverage b { color: var(--text); font-weight: 600; }
.detail { margin-top: 4px; color: var(--muted); min-height: 1.5em; }
label.check { display: flex; gap: 8px; align-items: center; margin-top: 16px; color: var(--muted); min-height: 44px; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--line); width: 16px; height: 16px; }
.viewer { height: 420px; border: 1px solid var(--line-3); position: relative; }
.viewer-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 16px; text-align: center; }
.model-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 12px; }
.model-note { color: var(--muted); max-width: 60ch; }
@media (max-width: 760px) {
  .panels { grid-template-columns: minmax(0, 1fr); }
  .readout { grid-template-columns: 110px minmax(0, 1fr); }
  .guide { width: 110px; height: 110px; }
  .hint { font-size: 16px; }
  .viewer { height: 320px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Face scan test</h1>
  <div class="stage" id="stage">
    <img id="feed" src="video.mjpg" alt="Live camera feed" decoding="async">
    <canvas id="boxes" aria-hidden="true"></canvas>
    <p class="stage-note" id="stage-note" role="status">Connecting to the camera server</p>
  </div>
  <div class="panels">
    <section class="panel" aria-labelledby="scan-title">
      <h2 id="scan-title">Scan</h2>
      <div class="buttons">
        <button type="button" class="primary" id="start">Start scan</button>
        <button type="button" id="stop" disabled>Stop</button>
      </div>
      <p class="status" id="status" role="status">Loading the face tracker.</p>
      <div class="readout">
        <canvas class="guide" id="guide"></canvas>
        <div>
          <p class="hint" id="hint" aria-live="polite"></p>
          <p class="coverage">Coverage <b id="coverage">0%</b> <span id="angles"></span></p>
          <p class="coverage">Elapsed <b id="elapsed">0.0 s</b> <span id="eta"></span></p>
          <p class="detail" id="detail"></p>
        </div>
      </div>
      <p class="detail" id="timing"></p>
      <label class="check"><input type="checkbox" id="mirrored"> The video is mirrored (swap left and right hints)</label>
    </section>
    <section class="panel" aria-labelledby="model-title">
      <h2 id="model-title">3D model</h2>
      <div class="viewer" id="viewer"><p class="viewer-empty" id="viewer-empty">No model yet. The first one appears about a second after the first sharp frame.</p></div>
      <div class="model-row">
        <p class="model-note" id="model-note"></p>
        <button type="button" id="download" disabled>Download .glb</button>
      </div>
    </section>
  </div>
</main>
<script type="module" src="scan-page.js"></script>
</body>
</html>
