<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<title>Face Context</title>
<meta name="description" content="Opt-in face to context viewer: tap a face in the live camera feed to see that person's profile, notes and face scan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hud.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<main class="stage" id="stage" aria-label="Camera feed. Select a face to see context.">
  <div class="media" id="media"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="faces" id="faces"></div>
  <div class="stage-msg" id="stage-msg" hidden></div>
</main>
<div class="camframe" aria-hidden="true"><i class="k tl"></i><i class="k tr"></i><i class="k bl"></i><i class="k br"></i></div>
<p class="rec" id="live" data-state="connecting"><i class="dot" aria-hidden="true"></i><span aria-hidden="true">REC</span><span class="visually-hidden" id="live-sr" role="status">Connecting</span><i class="mic" id="mic" role="img" data-state="off" aria-label="Microphone off"></i></p>
<div class="corner">
  <button type="button" class="session-dot" id="session-dot" aria-expanded="false" aria-controls="session-pop" hidden><i aria-hidden="true"></i></button>
  <section class="session-pop" id="session-pop" aria-label="Room consent session" hidden></section>
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<aside class="card" id="card" aria-label="Person context" hidden>
  <div class="card-shell">
    <div class="card-inner" id="card-inner">
      <div class="grip" id="grip" aria-hidden="true"><i></i></div>
      <button type="button" class="card-close" id="card-close" aria-label="Close profile">
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <div class="card-body" id="card-body"></div>
    </div>
  </div>
</aside>
<svg class="leader" id="leader" aria-hidden="true"></svg>
<script type="module" src="app.js"></script>
</body>
</html>
